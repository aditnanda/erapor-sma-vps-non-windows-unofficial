services:
  db:
    image: postgres:14
    container_name: erapor-sma-db
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: db_neweraporsma
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command: ["postgres", "-p", "54945"]
    volumes:
      - ./dbapp:/var/lib/postgresql/data
      - ./backup-erapor.dump:/docker-entrypoint-initdb.d/backup-erapor.dump:ro
      - ./docker/db/init/01-restore-erapor.sh:/docker-entrypoint-initdb.d/01-restore-erapor.sh:ro
    ports:
      - "8239:80"
      # Jika ingin akses database dari luar VPS/DBeaver, buka baris ini.
      # - "54945:54945"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 54945 -d db_neweraporsma || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erapor-sma-web
    restart: unless-stopped
    network_mode: "service:db"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./wwwroot:/var/www/html
